server {
    listen 8080;
    server_tokens off;

    location / {
        # Look "backend" up again while running, so the proxy finds it after a
        # restart. 127.0.0.11 is Docker's built-in DNS.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend http://backend:5001;
        proxy_pass $backend;
        proxy_set_header Host $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;     # longer than the backend's 25s limit
    }
}
