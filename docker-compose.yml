# Requires Docker Engine 28.0 or newer (isolated gateway mode, see "networks").
#
#   docker compose up -d --build --wait      start on http://localhost:5001
#   docker compose run --rm --build tests    pytest suite
#   docker compose down                      stop

name: algowiz

# Limits shared by the backend and the test container.
x-backend-limits: &backend-limits
  user: "10001:10001"           # sandboxrunner; the server and submissions share it
  init: true                    # reaps zombie processes
  read_only: true
  tmpfs:
    # "exec" is required: compiled submissions run from /tmp.
    - /tmp:rw,exec,nosuid,nodev,size=64m
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  # No seccomp entry on purpose: Docker's default seccomp profile applies, and
  # gdb's ptrace calls work under it.
  pids_limit: 128
  mem_limit: 512m
  memswap_limit: 512m           # equal to mem_limit: no extra swap
  cpus: 1.0

services:
  backend:
    <<: *backend-limits
    build:
      context: .
      target: runtime
    image: algowiz-backend
    restart: unless-stopped
    networks: [sandbox]         # internal only; reached through the proxy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5

  # A published port does not work on an internal network, so this small proxy
  # sits on both networks and forwards localhost:5001 to the backend.
  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:5001:8080"   # this machine only
    networks: [edge, sandbox]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  tests:
    <<: *backend-limits
    profiles: [test]
    build:
      context: .
      target: test
    image: algowiz-backend-test
    network_mode: none

networks:
  edge: {}
  sandbox:
    driver: bridge
    internal: true              # no route to other networks
    enable_ipv6: false
    driver_opts:
      # No host address on this network. "internal" alone still lets containers
      # reach services on the Docker host through the bridge address.
      com.docker.network.bridge.gateway_mode_ipv4: isolated
