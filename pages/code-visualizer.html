<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Custom Code Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Orbitron',sans-serif; background:#000; color:white; display:flex; height:100vh; overflow:hidden; }

  .left-panel { width:44%; min-width:340px; background:#111; border-right:2px solid #0ff3; padding:1.6rem; overflow-y:auto; }
  .left-panel h2 { color:#0ff; margin-bottom:1rem; font-size:1.5rem; }

  label { display:block; font-size:0.68rem; color:#0ff8; margin:0.7rem 0 0.3rem; text-transform:uppercase; letter-spacing:0.5px; }

  select, input[type=text], textarea {
    width:100%; background:#0ff05; border:2px solid #0ff3; border-radius:6px; color:#0ff;
    font-family:'Orbitron',sans-serif; font-size:0.75rem; padding:0.5rem; resize:vertical;
  }
  select { cursor:pointer; }
  textarea#codeEditor { font-family:'Courier New',monospace; font-size:0.78rem; height:220px; line-height:1.4rem; color:#0f0; background:#050505; }
  textarea#edgesInput { height:80px; font-family:'Courier New',monospace; }

  .row2 { display:flex; gap:8px; }
  .row2 > div { flex:1; }

  .controls { display:flex; gap:8px; flex-wrap:wrap; margin:1rem 0; }
  .btn { background:#0ff3; padding:0.55rem 0.9rem; border:none; border-radius:8px; cursor:pointer; color:black; font-family:'Orbitron',sans-serif; font-size:0.75rem; transition:background 0.3s; }
  .btn:hover { background:#0ff; }
  .btn:disabled { opacity:0.3; cursor:not-allowed; }
  .btn.secondary { background:#333; color:#0ff; border:1px solid #0ff3; }
  .btn.secondary:hover { background:#0ff2; }

  .speed-row { display:flex; align-items:center; gap:8px; margin-bottom:1rem; font-size:0.72rem; color:#0ff; }
  input[type=range] { flex:1; accent-color:#0ff; }

  #errorBox { font-size:0.7rem; color:#e24b4a; min-height:1rem; margin-bottom:0.5rem; white-space:pre-wrap; }
  #statusBox { font-size:0.72rem; color:#0ff; min-height:1.2rem; margin-bottom:0.5rem; text-align:center; }

  .right-panel { flex:1; min-width:300px; padding:1.6rem; overflow-y:auto; }
  .right-panel h1 { color:#0ff; font-size:1.5rem; margin-bottom:1rem; }

  .viz-box { background:#1a1a1a; border:2px solid #0ff3; border-radius:10px; min-height:260px; margin-bottom:1.2rem; padding:1rem; overflow:auto; }

  /* Array renderer */
  .bars-row { display:flex; align-items:flex-end; justify-content:center; gap:6px; height:220px; }
  .bar { width:32px; border-radius:4px 4px 0 0; background:#0ff; display:flex; align-items:flex-start; justify-content:center; padding-top:4px; font-size:0.65rem; color:#000; transition: all 0.25s ease; }

  /* Grid renderer */
  #gridGrid { display:inline-grid; gap:3px; }
  .grid-cell { width:42px; height:36px; display:flex; align-items:center; justify-content:center; font-size:0.7rem; border-radius:5px; background:#0ff1; border:2px solid #0ff; color:#0ff; transition:all 0.25s ease; }

  /* Graph renderer */
  #graphSVG { width:100%; height:260px; display:block; }
  .g-node { fill:#0ff1; stroke:#0ff; stroke-width:2; transition:all 0.25s ease; }
  .g-label { font-family:'Orbitron',sans-serif; font-size:11px; text-anchor:middle; dominant-baseline:central; fill:#0ff; pointer-events:none; }
  .g-sub { font-family:'Orbitron',sans-serif; font-size:9px; text-anchor:middle; fill:#0ff8; }
  .g-edge { stroke:#0ff4; stroke-width:1.5; transition:all 0.25s ease; }
  .g-edge-w { font-family:'Orbitron',sans-serif; font-size:9px; fill:#0ff8; text-anchor:middle; }

  /* Recursion renderer */
  #recursionLog { font-family:'Courier New',monospace; font-size:0.75rem; line-height:1.5rem; }
  .rec-line { white-space:pre; }
  .rec-enter { color:gold; }
  .rec-exit  { color:#0f0; }
  .rec-log   { color:#0ff; }
  .rec-done  { color:#0f0; font-weight:bold; }

  .api-box h2 { color:#0ff; font-size:1.1rem; margin:1.2rem 0 0.5rem; }
  .api-box p { font-size:0.85rem; color:#ccc; line-height:1.6; margin-bottom:0.8rem; }
  .api-box ul { margin-left:1.1rem; color:#ccc; line-height:1.7; font-size:0.85rem; }
  .api-box code { color:#0ff; background:#0ff1; padding:1px 5px; border-radius:4px; font-size:0.82rem; }
  .highlight { color:#0ff; font-weight:bold; }
</style>
</head>
<body>

<div class="left-panel">
  <h2>Custom Code Visualizer</h2>

  <label>Visualization type</label>
  <select id="typeSelect" onchange="switchType()">
    <option value="array">Array (sorting / searching)</option>
    <option value="graph">Graph (nodes &amp; edges)</option>
    <option value="grid">Grid (2D / DP table)</option>
    <option value="recursion">Recursion (call tree log)</option>
  </select>

  <div id="arrayInputs">
    <label>Array (comma-separated numbers)</label>
    <input type="text" id="arrayInput" value="5,3,8,1,9,2,7"/>
  </div>

  <div id="graphInputs" style="display:none;">
    <label>Nodes (comma-separated)</label>
    <input type="text" id="nodesInput" value="A,B,C,D,E"/>
    <label>Edges (one per line: <code>u v weight</code>)</label>
    <textarea id="edgesInput">A B 4
A C 2
B D 5
C D 1
D E 3</textarea>
    <label>Start node</label>
    <input type="text" id="startNodeInput" value="A"/>
  </div>

  <div id="gridInputs" style="display:none;">
    <div class="row2">
      <div><label>Rows</label><input type="text" id="gridRows" value="3"/></div>
      <div><label>Cols</label><input type="text" id="gridCols" value="3"/></div>
    </div>
    <label>Initial values (rows separated by <code>;</code>, cols by <code>,</code> — optional)</label>
    <input type="text" id="gridValues" value="1,2,3;4,5,6;7,8,9"/>
  </div>

  <div id="recursionInputs" style="display:none;">
    <label>Input value (a JS expression — number, string, or array)</label>
    <input type="text" id="recursionInput" value="6"/>
  </div>

  <label>Your code (must define a <code>run(input, viz)</code> function)</label>
  <textarea id="codeEditor"></textarea>

  <div class="controls">
    <button class="btn secondary" onclick="loadExample()">Load Example</button>
    <button class="btn" onclick="runCode()">Run ▶</button>
  </div>
  <div class="controls">
    <button class="btn" id="playBtn"  onclick="startPlay()" disabled>Play ▶</button>
    <button class="btn" id="stepBtn"  onclick="doStep()"    disabled>Step</button>
    <button class="btn" id="resetBtn" onclick="resetRun()"  disabled>Reset</button>
  </div>

  <div class="speed-row">
    <span>Slow</span>
    <input type="range" id="speedSlider" min="50" max="1000" value="400" step="50"/>
    <span>Fast</span>
  </div>

  <div id="errorBox"></div>
  <div id="statusBox">Write or load code, then press Run.</div>
</div>

<div class="right-panel">
  <h1>Visualization</h1>

  <div class="viz-box" id="vizBox">
    <div class="bars-row" id="barsRow"></div>
    <svg id="graphSVG" style="display:none;"></svg>
    <div id="gridGrid" style="display:none;"></div>
    <div id="recursionLog" style="display:none;"></div>
  </div>

  <div class="api-box" id="apiBox"></div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
//  SHARED STATE
// ─────────────────────────────────────────────────────────────
class VizStop extends Error {}
const MAX_STEPS = 3000;

let currentType = 'array';
let steps = [];
let stepIdx = 0;
let autoTimer = null;
let initialRenderFn = null; // called on Reset / before first step

const API_DOCS = {
  array: `
    <h2>Array API</h2>
    <p>Your <code>run(input, viz)</code> function receives <code>input</code> as a live array (mutate it directly, or use the helpers below) and a <code>viz</code> object to record visual steps.</p>
    <ul>
      <li><code>viz.compare(i, j)</code> — highlight two indices gold</li>
      <li><code>viz.swap(i, j)</code> — swaps <code>input[i]</code>/<code>input[j]</code> for you, highlights red</li>
      <li><code>viz.set(i, value)</code> — sets <code>input[i] = value</code>, highlights green</li>
      <li><code>viz.mark(i, color)</code> — highlight one index without changing data (<code>'gold'|'red'|'green'</code>)</li>
      <li><code>viz.log(message)</code> — status message only, no highlight change</li>
      <li><code>viz.done()</code> — marks the whole array green (call at the end, or it's added automatically)</li>
    </ul>`,
  graph: `
    <h2>Graph API</h2>
    <p><code>run(input, viz)</code> receives <code>input = { nodes, adj, start }</code>, where <code>adj[u]</code> is an array of <code>{ to, w }</code> for every edge touching <code>u</code> (edges are undirected).</p>
    <ul>
      <li><code>viz.visitNode(id)</code> — highlight a node gold</li>
      <li><code>viz.finalizeNode(id)</code> — mark a node green (done)</li>
      <li><code>viz.visitEdge(u, v)</code> — highlight an edge gold</li>
      <li><code>viz.setLabel(id, text)</code> — set the small label above a node (e.g. a running distance)</li>
      <li><code>viz.mark(id, color)</code> — set a node's color directly</li>
      <li><code>viz.log(message)</code> / <code>viz.done()</code></li>
    </ul>`,
  grid: `
    <h2>Grid API</h2>
    <p><code>run(input, viz)</code> receives <code>input</code> as a live 2D array (<code>input[r][c]</code>).</p>
    <ul>
      <li><code>viz.visitCell(r, c)</code> — highlight a cell gold</li>
      <li><code>viz.setCell(r, c, value)</code> — sets <code>input[r][c] = value</code>, highlights green</li>
      <li><code>viz.markCell(r, c, color)</code> — highlight a cell without changing its value</li>
      <li><code>viz.log(message)</code> / <code>viz.done()</code> — marks every cell green</li>
    </ul>`,
  recursion: `
    <h2>Recursion API</h2>
    <p><code>run(input, viz)</code> receives <code>input</code> as whatever value you entered (parsed as a JS expression). This renders as an indented call-log rather than a diagram, since recursive call shapes vary too much for one generic drawing.</p>
    <ul>
      <li><code>viz.enter(label)</code> — logs a line (gold) and indents one level deeper for calls made after it</li>
      <li><code>viz.exit(label)</code> — logs a line (green) and un-indents</li>
      <li><code>viz.log(message)</code> — logs a line (cyan) at the current indent level</li>
      <li><code>viz.done()</code></li>
    </ul>`
};

const EXAMPLES = {
  array: {
    input: '5,3,8,1,9,2,7',
    code: `function run(input, viz) {
  // Bubble sort, instrumented with the viz API
  const n = input.length;
  for (let i = 0; i < n - 1; i++) {
    for (let j = 0; j < n - 1 - i; j++) {
      viz.compare(j, j + 1);
      if (input[j] > input[j + 1]) {
        viz.swap(j, j + 1);
      }
    }
  }
  viz.done();
}`
  },
  graph: {
    nodes: 'A,B,C,D,E',
    edges: 'A B 4\nA C 2\nB D 5\nC D 1\nD E 3',
    start: 'A',
    code: `function run(input, viz) {
  // Breadth-first search from input.start
  const { adj, start } = input;
  const visited = new Set([start]);
  const queue = [start];
  viz.visitNode(start);

  while (queue.length > 0) {
    const u = queue.shift();
    for (const { to: v } of adj[u]) {
      viz.visitEdge(u, v);
      if (!visited.has(v)) {
        visited.add(v);
        viz.visitNode(v);
        queue.push(v);
      }
    }
    viz.finalizeNode(u);
  }
  viz.done();
}`
  },
  grid: {
    rows: '3', cols: '3', values: '',
    code: `function run(input, viz) {
  // Fill each cell with the sum of the cell above and to the left
  const rows = input.length, cols = input[0].length;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      viz.visitCell(r, c);
      const up   = r > 0 ? input[r-1][c] : 0;
      const left = c > 0 ? input[r][c-1] : 0;
      const value = (r === 0 && c === 0) ? 1 : up + left;
      viz.setCell(r, c, value);
    }
  }
  viz.done();
}`
  },
  recursion: {
    input: '6',
    code: `function run(input, viz) {
  function fib(n) {
    viz.enter(\`fib(\${n})\`);
    if (n <= 1) {
      viz.log(\`base case, return \${n}\`);
      viz.exit(\`fib(\${n}) = \${n}\`);
      return n;
    }
    const result = fib(n - 1) + fib(n - 2);
    viz.exit(\`fib(\${n}) = \${result}\`);
    return result;
  }
  const answer = fib(input);
  viz.log(\`Final answer: \${answer}\`);
  viz.done();
}`
  }
};

// ─────────────────────────────────────────────────────────────
//  TYPE SWITCHING
// ─────────────────────────────────────────────────────────────
function switchType() {
  currentType = document.getElementById('typeSelect').value;
  document.getElementById('arrayInputs').style.display     = currentType === 'array'     ? 'block' : 'none';
  document.getElementById('graphInputs').style.display     = currentType === 'graph'     ? 'block' : 'none';
  document.getElementById('gridInputs').style.display      = currentType === 'grid'      ? 'block' : 'none';
  document.getElementById('recursionInputs').style.display = currentType === 'recursion' ? 'block' : 'none';

  document.getElementById('barsRow').style.display      = currentType === 'array'     ? 'flex' : 'none';
  document.getElementById('graphSVG').style.display     = currentType === 'graph'     ? 'block' : 'none';
  document.getElementById('gridGrid').style.display      = currentType === 'grid'      ? 'inline-grid' : 'none';
  document.getElementById('recursionLog').style.display = currentType === 'recursion' ? 'block' : 'none';

  document.getElementById('apiBox').innerHTML = API_DOCS[currentType];
  loadExample();
  clearAll();
}

function loadExample() {
  const ex = EXAMPLES[currentType];
  document.getElementById('codeEditor').value = ex.code;
  if (currentType === 'array') {
    document.getElementById('arrayInput').value = ex.input;
  } else if (currentType === 'graph') {
    document.getElementById('nodesInput').value = ex.nodes;
    document.getElementById('edgesInput').value = ex.edges;
    document.getElementById('startNodeInput').value = ex.start;
  } else if (currentType === 'grid') {
    document.getElementById('gridRows').value = ex.rows;
    document.getElementById('gridCols').value = ex.cols;
    document.getElementById('gridValues').value = ex.values;
  } else if (currentType === 'recursion') {
    document.getElementById('recursionInput').value = ex.input;
  }
}

function clearAll() {
  clearTimer();
  steps = []; stepIdx = 0;
  document.getElementById('playBtn').disabled = true;
  document.getElementById('stepBtn').disabled = true;
  document.getElementById('resetBtn').disabled = true;
  document.getElementById('errorBox').textContent = '';
  document.getElementById('statusBox').textContent = 'Write or load code, then press Run.';
  document.getElementById('barsRow').innerHTML = '';
  document.getElementById('graphSVG').innerHTML = '';
  document.getElementById('gridGrid').innerHTML = '';
  document.getElementById('recursionLog').innerHTML = '';
}

// ─────────────────────────────────────────────────────────────
//  PARSERS
// ─────────────────────────────────────────────────────────────
function parseArrayInput() {
  return document.getElementById('arrayInput').value
    .split(',').map(s => s.trim()).filter(s => s.length)
    .map(Number);
}

function parseGraphInput() {
  const nodes = document.getElementById('nodesInput').value.split(',').map(s => s.trim()).filter(Boolean);
  const edgeLines = document.getElementById('edgesInput').value.split('\n').map(s => s.trim()).filter(Boolean);
  const adj = {}; nodes.forEach(n => adj[n] = []);
  const edges = [];
  edgeLines.forEach(line => {
    const parts = line.split(/\s+/);
    const u = parts[0], v = parts[1], w = parts[2] !== undefined ? Number(parts[2]) : 1;
    if (!adj[u]) adj[u] = [];
    if (!adj[v]) adj[v] = [];
    adj[u].push({to:v, w});
    adj[v].push({to:u, w});
    edges.push({u, v, w});
  });
  const start = document.getElementById('startNodeInput').value.trim();
  return { nodes, adj, edges, start };
}

function parseGridInput() {
  const rows = parseInt(document.getElementById('gridRows').value, 10);
  const cols = parseInt(document.getElementById('gridCols').value, 10);
  const raw = document.getElementById('gridValues').value.trim();
  let grid;
  if (raw) {
    grid = raw.split(';').map(row => row.split(',').map(s => Number(s.trim())));
  } else {
    grid = Array.from({length:rows}, () => new Array(cols).fill(0));
  }
  return grid;
}

function parseRecursionInput() {
  const raw = document.getElementById('recursionInput').value;
  try {
    return new Function('return (' + raw + ');')();
  } catch (e) {
    return raw;
  }
}

// ─────────────────────────────────────────────────────────────
//  VIZ RECORDERS (one per type)
// ─────────────────────────────────────────────────────────────
function makeArrayViz(arr) {
  function snap(highlight, color, message) {
    if (steps.length >= MAX_STEPS) throw new VizStop();
    steps.push({type:'array', arr:[...arr], highlight: highlight||[], color: color||null, message: message||''});
  }
  return {
    compare(i,j){ snap([i,j], 'gold', `Comparing index ${i} and ${j} (${arr[i]} vs ${arr[j]})`); },
    swap(i,j){ const t=arr[i]; arr[i]=arr[j]; arr[j]=t; snap([i,j], 'red', `Swapped index ${i} and ${j}`); },
    set(i,value){ arr[i]=value; snap([i], 'green', `Set index ${i} = ${value}`); },
    mark(i,color){ snap([i], color||'gold', `Marked index ${i}`); },
    log(msg){ snap([], null, msg); },
    done(){ snap(arr.map((_,i)=>i), 'green', '✅ Done'); }
  };
}

function edgeKey(u,v){ return [u,v].sort().join('~'); }

function makeGraphViz(graphInput) {
  const state = { colors:{}, edgeColors:{}, labels:{} };
  graphInput.nodes.forEach(n => { state.colors[n]='default'; state.labels[n]=''; });
  graphInput.edges.forEach(e => { state.edgeColors[edgeKey(e.u,e.v)]='default'; });

  function snap(message) {
    if (steps.length >= MAX_STEPS) throw new VizStop();
    steps.push({type:'graph', colors:{...state.colors}, edgeColors:{...state.edgeColors}, labels:{...state.labels}, message: message||''});
  }
  return {
    visitNode(id){ state.colors[id]='gold'; snap(`Visiting node ${id}`); },
    finalizeNode(id){ state.colors[id]='green'; snap(`Finalized node ${id}`); },
    visitEdge(u,v){ state.edgeColors[edgeKey(u,v)]='gold'; snap(`Visiting edge ${u}-${v}`); },
    setLabel(id,text){ state.labels[id]=String(text); snap(`Label ${id} = ${text}`); },
    mark(id,color){ state.colors[id]=color; snap(`Marked ${id}`); },
    log(msg){ snap(msg); },
    done(){ Object.keys(state.colors).forEach(id => state.colors[id]='green'); snap('✅ Done'); }
  };
}

function makeGridViz(grid) {
  const colors = grid.map(row => row.map(() => 'default'));
  function snap(message) {
    if (steps.length >= MAX_STEPS) throw new VizStop();
    steps.push({type:'grid', grid: grid.map(r=>[...r]), colors: colors.map(r=>[...r]), message: message||''});
  }
  return {
    visitCell(r,c){ colors[r][c]='gold'; snap(`Visiting cell (${r}, ${c})`); },
    setCell(r,c,value){ grid[r][c]=value; colors[r][c]='green'; snap(`Set cell (${r}, ${c}) = ${value}`); },
    markCell(r,c,color){ colors[r][c]=color; snap(`Marked cell (${r}, ${c})`); },
    log(msg){ snap(msg); },
    done(){ colors.forEach(row => row.forEach((_,c,arr) => arr[c]='green')); snap('✅ Done'); }
  };
}

function makeRecursionViz() {
  let indent = 0;
  function push(kind, text) {
    if (steps.length >= MAX_STEPS) throw new VizStop();
    steps.push({type:'recursion', indent, kind, text});
  }
  return {
    enter(label){ push('enter', label); indent++; },
    exit(label){ indent = Math.max(0, indent-1); push('exit', label); },
    log(msg){ push('log', msg); },
    done(){ indent = 0; push('done', '✅ Done'); }
  };
}

// ─────────────────────────────────────────────────────────────
//  RUN
// ─────────────────────────────────────────────────────────────
function runCode() {
  clearTimer();
  steps = []; stepIdx = 0;
  document.getElementById('errorBox').textContent = '';

  const code = document.getElementById('codeEditor').value;
  let truncated = false;

  try {
    if (currentType === 'array') {
      const arr = parseArrayInput();
      const initial = [...arr];
      initialRenderFn = () => renderArrayStep({arr: initial, highlight:[], color:null, message:'Ready.'});
      const viz = makeArrayViz(arr);
      const fn = new Function('input','viz', code + '\n;return run(input, viz);');
      try { fn(arr, viz); } catch(e) { if (e instanceof VizStop) truncated = true; else throw e; }

    } else if (currentType === 'graph') {
      const g = parseGraphInput();
      initialRenderFn = () => renderGraphStep({
        colors: Object.fromEntries(g.nodes.map(n=>[n,'default'])),
        edgeColors: Object.fromEntries(g.edges.map(e=>[edgeKey(e.u,e.v),'default'])),
        labels: {}, message:'Ready.'
      }, g);
      const viz = makeGraphViz(g);
      const fn = new Function('input','viz', code + '\n;return run(input, viz);');
      try { fn(g, viz); } catch(e) { if (e instanceof VizStop) truncated = true; else throw e; }

    } else if (currentType === 'grid') {
      const grid = parseGridInput();
      const initial = grid.map(r=>[...r]);
      initialRenderFn = () => renderGridStep({grid: initial, colors: initial.map(r=>r.map(()=>'default')), message:'Ready.'});
      const viz = makeGridViz(grid);
      const fn = new Function('input','viz', code + '\n;return run(input, viz);');
      try { fn(grid, viz); } catch(e) { if (e instanceof VizStop) truncated = true; else throw e; }

    } else if (currentType === 'recursion') {
      const val = parseRecursionInput();
      initialRenderFn = () => { document.getElementById('recursionLog').innerHTML = ''; };
      const viz = makeRecursionViz();
      const fn = new Function('input','viz', code + '\n;return run(input, viz);');
      try { fn(val, viz); } catch(e) { if (e instanceof VizStop) truncated = true; else throw e; }
    }
  } catch (err) {
    document.getElementById('errorBox').textContent = 'Error: ' + err.message;
    document.getElementById('statusBox').textContent = 'Fix the error above and press Run again.';
    return;
  }

  if (initialRenderFn) initialRenderFn();

  document.getElementById('statusBox').textContent = truncated
    ? `⚠️ Stopped early — too many steps (possible infinite loop). Showing first ${steps.length} steps.`
    : `${steps.length} step(s) recorded. Press Step or Play.`;

  document.getElementById('playBtn').disabled  = steps.length === 0;
  document.getElementById('stepBtn').disabled  = steps.length === 0;
  document.getElementById('resetBtn').disabled = steps.length === 0;
}

// ─────────────────────────────────────────────────────────────
//  STEP / PLAY / RESET
// ─────────────────────────────────────────────────────────────
function doStep() {
  if (stepIdx >= steps.length) return;
  const step = steps[stepIdx++];

  if (step.type === 'array') renderArrayStep(step);
  else if (step.type === 'graph') renderGraphStep(step, lastGraphInput);
  else if (step.type === 'grid') renderGridStep(step);
  else if (step.type === 'recursion') renderRecursionStep(step);

  document.getElementById('statusBox').textContent = step.message || `Step ${stepIdx}/${steps.length}`;

  if (stepIdx >= steps.length) {
    clearTimer();
    document.getElementById('playBtn').textContent = 'Play ▶';
  }
}

function startPlay() {
  if (autoTimer) { clearTimer(); document.getElementById('playBtn').textContent = 'Play ▶'; return; }
  if (stepIdx >= steps.length) return;
  document.getElementById('playBtn').textContent = 'Pause ⏸';
  const delay = 1050 - parseInt(document.getElementById('speedSlider').value);
  autoTimer = setInterval(() => {
    if (stepIdx >= steps.length) { clearTimer(); document.getElementById('playBtn').textContent = 'Play ▶'; return; }
    doStep();
  }, delay);
}

function resetRun() {
  clearTimer();
  document.getElementById('playBtn').textContent = 'Play ▶';
  stepIdx = 0;
  if (initialRenderFn) initialRenderFn();
  document.getElementById('statusBox').textContent = `Reset. ${steps.length} step(s) ready.`;
}

function clearTimer() { clearInterval(autoTimer); autoTimer = null; }

// ─────────────────────────────────────────────────────────────
//  RENDERERS
// ─────────────────────────────────────────────────────────────
function renderArrayStep(step) {
  const row = document.getElementById('barsRow');
  row.innerHTML = '';
  const maxVal = Math.max(...step.arr.map(Math.abs), 1);
  step.arr.forEach((v, i) => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = Math.round((Math.abs(v)/maxVal)*180 + 16) + 'px';
    let bg = '#0ff';
    if (step.highlight.includes(i)) {
      bg = step.color === 'red' ? 'red' : step.color === 'green' ? '#0f0' : 'gold';
    }
    bar.style.backgroundColor = bg;
    bar.textContent = v;
    row.appendChild(bar);
  });
}

let lastGraphInput = null;

function renderGraphStep(step, graphInput) {
  if (!graphInput) return;
  lastGraphInput = graphInput;
  const svg = document.getElementById('graphSVG');
  svg.innerHTML = '';
  const W = svg.clientWidth || 400, H = svg.clientHeight || 260;
  const cx = W/2, cy = H/2, R = Math.min(W,H)/2 - 40;
  const n = graphInput.nodes.length;
  const pos = {};
  graphInput.nodes.forEach((id, i) => {
    const angle = (i * 2*Math.PI/n) - Math.PI/2;
    pos[id] = { x: cx + R*Math.cos(angle), y: cy + R*Math.sin(angle) };
  });

  const colorMap = { default:'#0ff', gold:'gold', green:'#0f0', red:'#e24b4a' };

  graphInput.edges.forEach(e => {
    const a = pos[e.u], b = pos[e.v];
    if (!a || !b) return;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    line.classList.add('g-edge');
    const col = step.edgeColors[edgeKey(e.u,e.v)];
    line.style.stroke = col && col !== 'default' ? (colorMap[col]||col) : '#0ff4';
    line.style.strokeWidth = col && col !== 'default' ? '2.5' : '1.5';
    svg.appendChild(line);

    const wt = document.createElementNS('http://www.w3.org/2000/svg','text');
    wt.setAttribute('x', (a.x+b.x)/2); wt.setAttribute('y', (a.y+b.y)/2 - 4);
    wt.classList.add('g-edge-w');
    wt.textContent = e.w;
    svg.appendChild(wt);
  });

  graphInput.nodes.forEach(id => {
    const p = pos[id];
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', p.x); circle.setAttribute('cy', p.y); circle.setAttribute('r', 18);
    circle.classList.add('g-node');
    const col = step.colors[id];
    if (col && col !== 'default') {
      circle.style.stroke = colorMap[col] || col;
      circle.style.fill = (colorMap[col]||col) + '33';
    }
    svg.appendChild(circle);

    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x', p.x); label.setAttribute('y', p.y);
    label.classList.add('g-label');
    label.textContent = id;
    if (col && col !== 'default') label.style.fill = colorMap[col] || col;
    svg.appendChild(label);

    if (step.labels[id]) {
      const sub = document.createElementNS('http://www.w3.org/2000/svg','text');
      sub.setAttribute('x', p.x); sub.setAttribute('y', p.y - 26);
      sub.classList.add('g-sub');
      sub.textContent = step.labels[id];
      svg.appendChild(sub);
    }
  });
}

function renderGridStep(step) {
  const grid = document.getElementById('gridGrid');
  grid.innerHTML = '';
  const rows = step.grid.length, cols = step.grid[0].length;
  grid.style.gridTemplateColumns = `repeat(${cols}, 42px)`;
  const colorMap = { default:null, gold:'gold', green:'#0f0', red:'#e24b4a' };
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'grid-cell';
      const col = colorMap[step.colors[r][c]];
      if (col) { cell.style.borderColor = col; cell.style.color = col; cell.style.background = col + '22'; }
      cell.textContent = step.grid[r][c];
      grid.appendChild(cell);
    }
  }
}

function renderRecursionStep(step) {
  const log = document.getElementById('recursionLog');
  const line = document.createElement('div');
  line.className = 'rec-line rec-' + step.kind;
  const prefix = '  '.repeat(step.indent) + (step.kind === 'enter' ? '→ ' : step.kind === 'exit' ? '← ' : step.kind === 'done' ? '' : '· ');
  line.textContent = prefix + step.text;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

// ─────────────────────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────────────────────
switchType();
</script>
</body>
