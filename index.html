<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algorithm Wizard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Orbitron', sans-serif;
      scroll-behavior: smooth;
      height: 100%;
      background-color: #000;
      color: white;
    }

    .hero {
      height: 100vh;
      background: url('https://www.transparenttextures.com/patterns/circuit-board.png'), #0a0a0a;
      background-size: cover;
      background-blend-mode: overlay;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;

      /* Fade background on scroll */
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
    }

    .hero h1 {
      font-size: 4rem;
      color: #0ff;
      text-shadow: 0 0 20px #0ff;
      animation: glow 3s ease-in-out infinite alternate;
    }

    .hero p {
      font-size: 1.3rem;
      margin: 1rem 0;
      color: #ccc;
    }

    .scroll-button {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      font-size: 1.1rem;
      background: #0ff;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    .scroll-button:hover {
      background: #00b3b3;
    }

    .section {
      min-height: 100vh;
      padding: 4rem 2rem;
      background-color: #111;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2.5rem;
      color: #0ff;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      padding: 1rem;
    }

    .card {
      background: #1a1a1a;
      padding: 2rem;
      border-radius: 10px;
      border: 1px solid #0ff3;
      text-align: center;
      transition: 0.3s;
      cursor: pointer;
    }

    .card:hover {
      background: #0ff2;
      color: #000;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px #0ff;
      }
      to {
        text-shadow: 0 0 20px #0ff, 0 0 30px #0ff;
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <h1>Algorithm Wizard</h1>
    <p>Master Algorithms Through Powerful Visualizations</p>
    <button class="scroll-button" onclick="document.getElementById('categories').scrollIntoView({ behavior: 'smooth' })">
      Explore
    </button>
  </section>

  <section class="section" id="categories">
    <h2>Choose Your Path</h2>
    <div class="category-grid">
      <div class="card" onclick="location.href='pages/backtracking.html'">Backtracking</div>
      <div class="card" onclick="location.href='pages/divideandconquer.html'">Divide & Conquer</div>
      <div class="card" onclick="location.href='pages/dp.html'">Dynamic Programming</div>
      <div class="card" onclick="location.href='pages/graph.html'">Graphs</div>
      <div class="card" onclick="location.href='pages/greedy.html'">Greedy</div>
      <div class="card" onclick="location.href='pages/sort.html'">Sorting Algorithms</div>
      <div class="card" onclick="location.href='upload.html'">Upload Your Own Code</div>
    </div>
  </section>

</body>
</html>
